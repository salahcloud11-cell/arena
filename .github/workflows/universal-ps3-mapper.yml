name: Universal PS3 Mapper APK
on:
  workflow_dispatch:
  push:
    branches: ['arena/a4fd9a7a-arena']
    paths:
      - 'universal-ps3-mapper/**'
      - '.github/workflows/universal-ps3-mapper.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build, sign and verify
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          APP="$GITHUB_WORKSPACE/universal-ps3-mapper"
          OUT="$RUNNER_TEMP/universal"
          rm -rf "$OUT" && mkdir -p "$OUT/gen" "$OUT/classes" "$OUT/dex"
          "$BT/aapt2" compile --dir "$APP/res" -o "$OUT/res.zip"
          "$BT/aapt2" link -o "$OUT/unsigned.apk" -I "$JAR" --manifest "$APP/AndroidManifest.xml" \
            --java "$OUT/gen" --min-sdk-version 24 --target-sdk-version 28 --version-code 10000 \
            --version-name 1.0 --auto-add-overlay "$OUT/res.zip"
          find "$APP/java" "$OUT/gen" -name '*.java' -print0 | xargs -0 javac \
            -source 8 -target 8 -encoding UTF-8 -classpath "$JAR" -d "$OUT/classes"
          mapfile -d '' CLS < <(find "$OUT/classes" -name '*.class' -print0)
          "$BT/d8" --min-api 24 --output "$OUT/dex" "${CLS[@]}"
          (cd "$OUT/dex" && zip -q -j "$OUT/unsigned.apk" classes.dex)
          "$BT/zipalign" -f -p 4 "$OUT/unsigned.apk" "$OUT/Universal-PS3-Mapper-v1.apk"
          "$BT/apksigner" sign --ks incredible-jack-ps3pad/signing/ps3mod.keystore \
            --ks-key-alias ps3mod --ks-pass pass:ps3mod --key-pass pass:ps3mod \
            --v1-signing-enabled true --v2-signing-enabled true "$OUT/Universal-PS3-Mapper-v1.apk"
          "$BT/apksigner" verify --verbose --print-certs "$OUT/Universal-PS3-Mapper-v1.apk" | tee "$OUT/verify.log"
          "$BT/aapt" dump badging "$OUT/Universal-PS3-Mapper-v1.apk" | tee "$OUT/badging.log"
          grep -q "package: name='com.ps3mod.universal'" "$OUT/badging.log"
          grep -q "application-label:'Universal PS3 Mapper'" "$OUT/badging.log"
          sha256sum "$OUT/Universal-PS3-Mapper-v1.apk" | tee "$OUT/Universal-PS3-Mapper-v1.apk.sha256"
      - name: Publish release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/universal"
          cat > "$OUT/release.md" <<'EOF'
          Separate per-game PS3 controller-to-touch mapper for Android.

          - no-root AccessibilityService button and D-pad mapping
          - draggable arbitrary touch targets and per-game profiles
          - invisible play mode and 1x–5x multi-click
          - L3+R3 overlay recovery
          - optional ADB bridge for global right-stick cursor input
          - Android 7+; optimized for Android 11 and 32-bit devices
          EOF
          if gh release view universal-ps3-mapper-latest >/dev/null 2>&1; then
            gh release upload universal-ps3-mapper-latest "$OUT/Universal-PS3-Mapper-v1.apk" "$OUT/Universal-PS3-Mapper-v1.apk.sha256" --clobber
            gh release edit universal-ps3-mapper-latest --title "Universal PS3 Mapper v1" --notes-file "$OUT/release.md"
          else
            gh release create universal-ps3-mapper-latest --target "$GITHUB_SHA" --title "Universal PS3 Mapper v1" \
              --notes-file "$OUT/release.md" "$OUT/Universal-PS3-Mapper-v1.apk" "$OUT/Universal-PS3-Mapper-v1.apk.sha256"
          fi
      - name: Transfer APK
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/universal"
          mkdir -p universal-ps3-mapper/transfer
          cp "$OUT/Universal-PS3-Mapper-v1.apk" universal-ps3-mapper/transfer/
          cp "$OUT/Universal-PS3-Mapper-v1.apk.sha256" universal-ps3-mapper/transfer/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f universal-ps3-mapper/transfer
          git commit -m "transfer: Universal PS3 Mapper ${GITHUB_SHA:0:8} [skip ci]"
          git push
