name: Incredible Jack PS3 controller mod

on:
  push:
    branches: ["arena/**", "main"]
    paths:
      - ".github/workflows/incredible-jack-ps3.yml"
      - "incredible-jack-ps3pad/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: incredible-jack-ps3
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORK: ${{ github.workspace }}/jackwork
      DRIVE_FILE_ID: 1rjb0CeOME0zI5aI1P5IfTQWqo7DHZ1Fe
      EXPECTED_BYTES: 87866720
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare tools
        run: |
          set -euo pipefail
          mkdir -p "$WORK/logs" "$WORK/tools"
          python3 -m pip install --quiet gdown
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$ANDROID_HOME/build-tools/34.0.0/aapt" ]; then
            yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
            "$SDKMAN" "platforms;android-34" "build-tools;34.0.0"
          fi
          curl -fL --retry 3 -o "$WORK/tools/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar

      - name: Download and inspect original APK
        run: |
          set -euo pipefail
          APK="$WORK/incredible-jack.apk"
          {
            echo "Downloading public Drive file $DRIVE_FILE_ID"
            gdown "$DRIVE_FILE_ID" -O "$APK"
            echo "downloaded bytes: $(stat -c%s "$APK") (Drive metadata said $EXPECTED_BYTES)"
            test "$(stat -c%s "$APK")" -gt 1000000
            unzip -t "$APK" >/dev/null
          } 2>&1 | tee "$WORK/logs/download.log"
          {
            echo "== FILE =="
            stat "$APK"
            sha256sum "$APK"
            file "$APK"
            unzip -t "$APK" | tail -3
            echo
            echo "== BADGING =="
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK"
            echo
            echo "== APK CONTENTS (engine clues) =="
            (unzip -l "$APK" | grep -Ei 'classes.*dex|lib/|assets/|unity|libgdx|cocos|godot|flutter' | head -400) || true
            echo
            echo "== MANIFEST XMLTREE =="
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml
          } 2>&1 | tee "$WORK/logs/inspect.log"

          java -Xmx3g -jar "$WORK/tools/apktool.jar" d -f -o "$WORK/tree" "$APK" \
            2>&1 | tee "$WORK/logs/apktool.log"
          {
            echo "== DECODED MANIFEST =="
            cat "$WORK/tree/AndroidManifest.xml"
            echo
            echo "== SMALI ROOTS =="
            (find "$WORK/tree" -maxdepth 3 -type d | head -200) || true
            echo
            echo "== ACTIVITY SMALI =="
            (grep -RIlE 'UnityPlayerActivity|onCreate\(Landroid/os/Bundle|dispatchKeyEvent|dispatchGenericMotionEvent' \
              "$WORK/tree"/smali* 2>/dev/null | head -100) || true
          } 2>&1 | tee "$WORK/logs/decoded.log"

      - name: Build, sign and verify PS3 mod
        run: |
          set -euo pipefail
          mkdir -p "$WORK/keys"
          cp incredible-jack-ps3pad/signing/ps3mod.keystore "$WORK/keys/ps3mod.keystore"
          python3 incredible-jack-ps3pad/tools/patch_apk.py \
            --apk-in "$WORK/incredible-jack.apk" \
            --java-src incredible-jack-ps3pad/java \
            --apktool "$WORK/tools/apktool.jar" \
            --android-jar "$ANDROID_HOME/platforms/android-34/android.jar" \
            --build-tools "$ANDROID_HOME/build-tools/34.0.0" \
            --java "$JAVA_HOME/bin/java" \
            --work "$WORK/patch" \
            --keydir "$WORK/keys" \
            --out "$WORK/Incredible-Jack-PS3-v5.apk" \
            2>&1 | tee "$WORK/logs/patch.log"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="$WORK/Incredible-Jack-PS3-v5.apk"
          HASH=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > "$WORK/release.md" <<EOF
          Incredible Jack 1.36.6 with fully customizable DualShock 3 support.

          - original Cocos2d-x activity remains the launcher
          - all PS3 buttons, both sticks, analog triggers and five extra buttons
          - invisible touch targets and fully hideable small menu bar (L3+R3 restores it)
          - ReMouse-inspired continuous 60 Hz right-stick cursor with edge-safe bounds
          - fixed assignable cursor/menu hotkeys in the focused Control Studio dialog
          - offline ad-free manifest: no INTERNET, ad ID or ad lifecycle components
          - tap CROSS (X) to click; hold X and use R-stick/D-pad to scroll
          - Smart PlayStation Input accepts standard and raw BUTTON_1..12 layouts,
            HAT-axis D-pad, direct/polled events and analog-trigger hysteresis
          - PLACE, CHANGE and per-button 1x-5x multi-click Control Studio
          - synthetic touches use the game's own on-screen controls
          - arm64-v8a and armeabi-v7a preserved

          SHA-256: \`$HASH\`
          EOF
          if gh release view incredible-jack-ps3-latest >/dev/null 2>&1; then
            gh release upload incredible-jack-ps3-latest "$APK" "$APK.sha256" --clobber
            gh release edit incredible-jack-ps3-latest \
              --title "Incredible Jack 1.36.6 + PS3 Controller v5" --notes-file "$WORK/release.md"
          else
            gh release create incredible-jack-ps3-latest --target "$GITHUB_SHA" \
              --title "Incredible Jack 1.36.6 + PS3 Controller v5" \
              --notes-file "$WORK/release.md" "$APK" "$APK.sha256"
          fi
          gh release view incredible-jack-ps3-latest 2>&1 | tee "$WORK/logs/release.log"

      - name: Transfer built APK into branch
        run: |
          set -euo pipefail
          mkdir -p incredible-jack-ps3pad/transfer
          cp "$WORK/Incredible-Jack-PS3-v5.apk" incredible-jack-ps3pad/transfer/
          cp "$WORK/Incredible-Jack-PS3-v5.apk.sha256" incredible-jack-ps3pad/transfer/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f incredible-jack-ps3pad/transfer
          git commit -m "transfer: Incredible Jack PS3 build ${GITHUB_SHA:0:8} [skip ci]"
          git push

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incredible-jack-ps3-build
          path: ${{ env.WORK }}/logs

      - name: Post inspection as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > "$WORK/comment.md"
          import os
          print('### Incredible Jack APK inspection')
          for name in ('download.log', 'inspect.log', 'apktool.log', 'decoded.log', 'patch.log', 'release.log'):
              path = os.path.join(os.environ['WORK'], 'logs', name)
              if not os.path.exists(path): continue
              text = open(path, errors='replace').read()
              if len(text) > 18000: text = text[:9000] + '\n... truncated ...\n' + text[-9000:]
              print(f'\n<details><summary>{name}</summary>\n\n```\n{text}\n```\n</details>')
          PY
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(cat "$WORK/comment.md")" || true
