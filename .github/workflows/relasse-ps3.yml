name: app-release COD BOZ full PS3 controller
on:
  workflow_dispatch:
  push:
    branches: ['arena/a4fd9a7a-arena']
    paths:
      - 'relasse-ps3pad/**'
      - '.github/workflows/relasse-ps3.yml'
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Prepare and decode
        run: |
          set -euo pipefail
          pip -q install gdown
          W="$RUNNER_TEMP/relasse"; mkdir -p "$W"
          gdown '1Xv-6dgu3RFSrpjkfPYGbdgvGvaczJwvy' -O "$W/source.apk"
          gdown '1WLmwIOel76K6xFxY7e8eJUyQGtXoS3rQ' -O "$W/v8.apk"
          gdown '1QjhmTCA0GHCQlVVt3U5hpQ43T4yHkBOd' -O "$W/boz-v6.keystore"
          test "$(stat -c%s "$W/source.apk")" = 43794635
          echo '6d2f13fae7f39eb64471c44c272240291bd86ba1ab8a0200083773f0c8af9c22  '"$W/source.apk" | sha256sum -c -
          curl -fL --retry 3 -o "$W/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -Xmx3g -jar "$W/apktool.jar" d -f -o "$W/tree" "$W/source.apk"
          java -Xmx3g -jar "$W/apktool.jar" d -f -r -o "$W/v8tree" "$W/v8.apk"
      - name: Inject proven full controller
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/relasse"
          test -f "$W/v8tree/smali/com/bozpad/BozPad.smali"
          rm -rf "$W/tree/smali/com/bozpad"
          cp -a "$W/v8tree/smali/com/bozpad" "$W/tree/smali/com/bozpad"
          python3 relasse-ps3pad/tools/hook_main.py "$W/tree/smali/com/activision/boz/Main.smali"
          python3 - <<'PY'
          import pathlib,re,os
          w=pathlib.Path(os.environ['RUNNER_TEMP'])/'relasse'; p=w/'tree/AndroidManifest.xml'; s=p.read_text()
          s=re.sub(r'(<application\b[^>]*android:label=")[^"]*',r'\1COD BOZ PS3 Full',s,count=1)
          s=re.sub(r'(<activity\b[^>]*android:name="com\.activision\.boz\.Main"[^>]*android:label=")[^"]*',r'\1COD BOZ PS3 Full',s,count=1)
          s=re.sub(r'android:versionName="[^"]*"','android:versionName="1.0.8.1kotlin-ps3v1"',s,count=1)
          p.write_text(s)
          y=w/'tree/apktool.yml'; q=y.read_text();q=re.sub(r'^(\s*versionName:\s*).*$',r'\g<1>1.0.8.1kotlin-ps3v1',q,count=1,flags=re.M);y.write_text(q)
          PY
          grep -q 'Lcom/bozpad/BozPad;->dispatchKeyEvent' "$W/tree/smali/com/activision/boz/Main.smali"
          grep -q 'Lcom/bozpad/BozPad;->onGenericMotionEvent' "$W/tree/smali/com/activision/boz/Main.smali"
      - name: Build sign and verify
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/relasse"; BT="$ANDROID_HOME/build-tools/34.0.0"
          java -Xmx3g -jar "$W/apktool.jar" b "$W/tree" -o "$W/unsigned.apk"
          "$BT/zipalign" -f -p 4 "$W/unsigned.apk" "$W/COD-BOZ-app-release-PS3-v1.apk"
          "$BT/apksigner" sign --ks "$W/boz-v6.keystore" --ks-key-alias bozpad \
            --ks-pass pass:bozpad2026 --key-pass pass:bozpad2026 --v1-signing-enabled true \
            --v2-signing-enabled true "$W/COD-BOZ-app-release-PS3-v1.apk"
          "$BT/apksigner" verify --verbose --print-certs "$W/COD-BOZ-app-release-PS3-v1.apk" | tee "$W/verify.txt"
          "$BT/aapt" dump badging "$W/COD-BOZ-app-release-PS3-v1.apk" | tee "$W/badging.txt"
          grep -q "package: name='com.activision.boz'" "$W/badging.txt"
          grep -q "versionName='1.0.8.1kotlin-ps3v1'" "$W/badging.txt"
          grep -q "launchable-activity: name='com.activision.boz.Main'" "$W/badging.txt"
          java -Xmx3g -jar "$W/apktool.jar" d -f -r -o "$W/check" "$W/COD-BOZ-app-release-PS3-v1.apk" >/dev/null
          grep -q 'Lcom/bozpad/BozPad;->dispatchKeyEvent' "$W/check/smali/com/activision/boz/Main.smali"
          grep -q 'Lcom/bozpad/BozPad;->onGenericMotionEvent' "$W/check/smali/com/activision/boz/Main.smali"
          python3 - <<'PY'
          import hashlib,zipfile,os
          w=os.path.join(os.environ['RUNNER_TEMP'],'relasse')
          def payload(path):
            with zipfile.ZipFile(path) as z:return {n:hashlib.sha256(z.read(n)).digest() for n in z.namelist() if n.startswith(('assets/','lib/')) and not n.endswith('/')}
          a=payload(w+'/source.apk');b=payload(w+'/COD-BOZ-app-release-PS3-v1.apk')
          if a!=b:
            print('missing/changed',sorted(set(a)^set(b))[:30]);raise SystemExit('game payload changed')
          print('verified immutable game payload:',len(a),'assets/libraries')
          PY
          (cd "$W" && sha256sum COD-BOZ-app-release-PS3-v1.apk > COD-BOZ-app-release-PS3-v1.apk.sha256)
      - name: Publish release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/relasse"
          cat > "$W/notes.md" <<'EOF'
          COD:BOZ app-release 1.0.8.1kotlin with the proven BOZ v8 controller engine:
          left-stick movement, right-stick camera, D-pad, face buttons, shoulders,
          analog/digital triggers, Start/Select, L3/R3 and developer-style Marmalade key/touch injection.
          Original assets and armeabi-v7a native libraries are byte-identical.
          EOF
          if gh release view relasse-ps3-latest >/dev/null 2>&1; then
            gh release upload relasse-ps3-latest "$W/COD-BOZ-app-release-PS3-v1.apk" "$W/COD-BOZ-app-release-PS3-v1.apk.sha256" --clobber
            gh release edit relasse-ps3-latest --title 'COD BOZ app-release Full PS3 v1' --notes-file "$W/notes.md"
          else
            gh release create relasse-ps3-latest --target "$GITHUB_SHA" --title 'COD BOZ app-release Full PS3 v1' --notes-file "$W/notes.md" "$W/COD-BOZ-app-release-PS3-v1.apk" "$W/COD-BOZ-app-release-PS3-v1.apk.sha256"
          fi
      - name: Transfer APK
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/relasse";mkdir -p relasse-ps3pad/transfer
          cp "$W/COD-BOZ-app-release-PS3-v1.apk" "$W/COD-BOZ-app-release-PS3-v1.apk.sha256" relasse-ps3pad/transfer/
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f relasse-ps3pad/transfer;git commit -m "transfer: COD BOZ app-release PS3 ${GITHUB_SHA:0:8} [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME";git push
