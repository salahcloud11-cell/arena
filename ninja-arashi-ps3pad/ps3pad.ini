# ps3pad.ini -- DualShock 3 / PS3 controller mapping for the modded Ninja Arashi
#
# Copy this file to the phone at:
#   /sdcard/Android/data/com.blackpanther.ninjaarashi/files/ps3pad.ini
# (adb push ps3pad.ini /sdcard/Android/data/com.blackpanther.ninjaarashi/files/)
#
# It is read once, when the game starts.  Everything here is optional:
# without the file the built-in defaults below are used.
#
# Button numbers are the "joystick button" indices Unity reports for the pad.
# Typical DualShock 3 numbers on Android:
#   0 Cross   1 Circle   2 Square*   3 Square/Triangle*   4 Triangle
#   6 L1      7 R1       8 L2        9 R2
#   10 L3     11 R3      12 Start    13 Select
# (*) the two Android/DualShock numbering schemes differ, so the mod listens to
#     buttons 2 AND 3 for "attack" by default.  If a button does not do what you
#     expect, set log_buttons=1, press it, and read which index shows up in the
#     log (see log file / logcat tag "ps3pad"), then put that number here.

# stick dead zone in thousandths (350 = 0.35 of full deflection). Lower = more
# sensitive, raise it if the ninja walks by itself.
deadzone=350

# Cross        -> jump
jump=0
jump2=-1
# Square       -> attack / check  (2 and 3 both listen: see note above)
attack=3
attack2=2
# Circle       -> dash
dash=1
dash2=-1
# Triangle     -> throw (Fi / special)
special=4
special2=-1
# L1 / R1      -> transform
transform=6
transform2=7

# move with the direction pad as well as the left stick (1 = yes)
dpad_move=1

# 1 = write a status line to the log every ~15 s, 1 = log every button press
log_state=1
log_buttons=1

# Unused entries: set to -1 to disable, e.g. dash2=-1
# Other useful values: 8=L2, 9=R2, 12=Start, 13=Select
